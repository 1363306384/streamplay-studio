name: Update v2.9.5 release description
on:
  push:
    paths:
      - '.github/workflows/update-v2.9.5-notes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update existing release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          Streamplay Studio 是面向 TikTok LIVE 团播与互动直播的桌面管理工具，用于集中管理直播流程、礼物与积分、PK 互动、画面叠加及直播状态。

          Streamplay Studio is a desktop management tool for TikTok LIVE group and interactive broadcasts. It brings live workflows, gifts and scores, PK interactions, visual overlays, and stream status together in one place.

          ## 下载与安装

          | 系统 | 安装包 | 安装方式 |
          | --- | --- | --- |
          | Windows 64 位 | `Streamplay.Studio-Setup-2.9.5-x64.exe` | 下载后双击运行安装程序。 |
          | macOS（Apple Silicon） | `Streamplay.Studio-2.9.5-Apple-Silicon.dmg` | 打开 DMG，将应用拖入“应用程序”。 |

          > macOS 安装包仅适用于 Apple Silicon（M1、M2、M3、M4 系列）；本版本暂未提供 Intel Mac 安装包。
          EOF
          gh release edit v2.9.5 --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
